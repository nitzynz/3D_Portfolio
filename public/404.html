<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nithyashree Govindarajan | Portfolio</title>
    <!--
      GitHub Pages has no server-side routing, so a hard refresh (or a
      direct link) on any client-side route like /3D_Portfolio/about would
      normally 404. This redirects that request back to index.html with the
      original path packed into a query string; a small script in
      index.html unpacks it and restores the real URL via history.replaceState
      before React Router mounts. Based on the well-established
      rafgraph/spa-github-pages pattern.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep "/3D_Portfolio"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
